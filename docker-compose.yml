services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coliseu
      POSTGRES_USER: coliseu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coliseu}
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coliseu -d coliseu"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://coliseu:${POSTGRES_PASSWORD:-coliseu}@db:5432/coliseu
    depends_on:
      db: { condition: service_healthy }
  app:
    build:
      context: .
      target: runner
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://coliseu:${POSTGRES_PASSWORD:-coliseu}@db:5432/coliseu
      STORAGE_PATH: /app/storage
      SESSION_TTL_HOURS: 12
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      HEALTH_MIN_STORAGE_FREE_PERCENT: ${HEALTH_MIN_STORAGE_FREE_PERCENT:-10}
      SEFAZ_ENABLED: ${SEFAZ_ENABLED:-false}
      SEFAZ_ENVIRONMENT: ${SEFAZ_ENVIRONMENT:-homologation}
      SEFAZ_CNPJ: ${SEFAZ_CNPJ:-}
      SEFAZ_UF_CODE: ${SEFAZ_UF_CODE:-}
      SEFAZ_CERTIFICATE_BASE64: ${SEFAZ_CERTIFICATE_BASE64:-}
      SEFAZ_CERTIFICATE_PASSWORD: ${SEFAZ_CERTIFICATE_PASSWORD:-}
      SEFAZ_SYNC_INTERVAL_MINUTES: ${SEFAZ_SYNC_INTERVAL_MINUTES:-60}
      SEFAZ_MAX_BATCHES_PER_SYNC: ${SEFAZ_MAX_BATCHES_PER_SYNC:-20}
    ports: ["3000:3000"]
    volumes: ["product_storage:/app/storage"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  sefaz-worker:
    build: { context: ., target: worker }
    environment:
      DATABASE_URL: postgresql://coliseu:${POSTGRES_PASSWORD:-coliseu}@db:5432/coliseu
      SEFAZ_ENABLED: ${SEFAZ_ENABLED:-false}
      SEFAZ_ENVIRONMENT: ${SEFAZ_ENVIRONMENT:-homologation}
      SEFAZ_CNPJ: ${SEFAZ_CNPJ:-}
      SEFAZ_UF_CODE: ${SEFAZ_UF_CODE:-}
      SEFAZ_CERTIFICATE_BASE64: ${SEFAZ_CERTIFICATE_BASE64:-}
      SEFAZ_CERTIFICATE_PASSWORD: ${SEFAZ_CERTIFICATE_PASSWORD:-}
      SEFAZ_SYNC_INTERVAL_MINUTES: ${SEFAZ_SYNC_INTERVAL_MINUTES:-60}
      SEFAZ_MAX_BATCHES_PER_SYNC: ${SEFAZ_MAX_BATCHES_PER_SYNC:-20}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  backup:
    build: { context: ., dockerfile: Dockerfile.backup }
    profiles: ["maintenance"]
    environment:
      DATABASE_URL: postgresql://coliseu:${POSTGRES_PASSWORD:-coliseu}@db:5432/coliseu
      BACKUP_PATH: /backups
      STORAGE_SOURCE_PATH: /storage
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - product_storage:/storage:ro
      - backup_storage:/backups
    depends_on:
      db: { condition: service_healthy }
volumes:
  postgres_data:
  product_storage:
  backup_storage:
