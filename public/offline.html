<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172744">
  <title>Sem conexão | Coliseon PDV</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #172036; background: #f5f7fb; }
    main { width: min(100%, 440px); text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 22px; }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; }
    p { margin: .8rem 0 0; color: #667085; line-height: 1.55; }
    .actions { margin-top: 1.6rem; display: grid; gap: .6rem; }
    button { min-height: 46px; border: 0; border-radius: 10px; background: #182847; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #243b66; }
    small { display: block; margin-top: 1.2rem; color: #98a2b3; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 512 512" role="img" aria-label="Coliseon PDV">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25416f"/><stop offset="1" stop-color="#121d36"/></linearGradient>
        <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade9a"/><stop offset="1" stop-color="#12b76a"/></linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#bg)"/>
      <path d="M341 171A120 120 0 1 0 341 341" fill="none" stroke="url(#mk)" stroke-width="58" stroke-linecap="round"/>
      <circle cx="352" cy="256" r="22" fill="#fff"/>
    </svg>
    <h1>Você está sem conexão</h1>
    <p>O Coliseon precisa de internet para registrar vendas e consultar estoque, financeiro e notas fiscais. Verifique o Wi-Fi ou os dados móveis e tente novamente.</p>
    <div class="actions"><button type="button" id="retry">Tentar novamente</button></div>
    <small>Nenhuma venda ou dado é guardado neste aparelho enquanto você está offline.</small>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.href = "/login"; });
    window.addEventListener("online", function () { location.href = "/login"; });
  </script>
</body>
</html>
